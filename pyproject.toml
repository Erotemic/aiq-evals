[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq-evals"
version = "0.1.0"
description = "Backend-agnostic evaluation runtime and artifact interface for AIQ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kitware" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
inspect = [
  "inspect-ai==0.3.272",
]
tests = [
  "pytest>=8.1.1",
  "pytest-cov>=5",
]
dev = [
  "aiq-evals[tests]",
  "ruff>=0.9",
]

[project.scripts]
aiq-evals = "aiq_evals.cli:main"

[project.urls]
Repository = "https://github.com/AIQ-Kitware/aiq-evals/"

[tool.setuptools.packages.find]
include = ["aiq_evals*"]

[tool.setuptools.package-data]
aiq_evals = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["aiq_evals"]

[tool.coverage.report]
show_missing = true

[tool.xcookie]
tags = ["github", "purepy"]
mod_name = "aiq_evals"
repo_name = "aiq-evals"
pkg_name = "aiq-evals"
typed = true
os = ["linux"]
min_python = "3.11"
max_python = "3.14"
main_python = "3.13"
ci_cpython_versions = ["3.11", "3.13"]
ci_pypy_versions = []
use_setup_py = false
use_pyproject_requirements = true
linter = true
