# Engine-free and per-engine native CI (plan phase 8).
# Every job runs a dev/ci/*.sh script, so local runs match CI exactly.
# Deterministic only: paid/gpu/external/docker_sandbox-marked tests never run here.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-free:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: dev/ci/engine_free.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  native-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: dev/ci/native_inspect.sh

  native-olmo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: dev/ci/native_olmo.sh

  native-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # MAGNET compatibility tests run when this pinned checkout is reachable;
      # the HELM adapter and conformance suites do not need it.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: AIQ-Kitware/aiq-magnet
          ref: 7bb105ab1c85bfaa01bf68c97ff7523332479ee4
          path: aiq-magnet
      - run: |
          if [ -d aiq-magnet/.git ]; then export MAGNET_DIR=$PWD/aiq-magnet; fi
          dev/ci/native_helm.sh
